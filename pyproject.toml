[project]
name = "agentic-evals"
version = "0.1.0"
description = "A reference implementation of a Claude agent and the task-based evals that test it"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6.0",
    "mcp>=2.3.0",
    "pydantic>=2.12",
    "pyyaml>=6.0.3",
    "tzdata>=2025.2; sys_platform == 'win32'",  # time zones for the example's convert_time tool
]

[dependency-groups]
dev = ["pytest>=9.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentic_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Prompts are written one paragraph per line, because line breaks inside a prompt are part of
# what the model reads. Seed data reads best one record per line.
"agentic_evals/screen.py" = ["E501"]
"agentic_evals/evals/graders.py" = ["E501"]
"examples/assistant/agent.py" = ["E501"]
"examples/helpdesk/agent.py" = ["E501"]
"examples/analyst/agent.py" = ["E501"]
"examples/assistant/data.py" = ["E501"]
